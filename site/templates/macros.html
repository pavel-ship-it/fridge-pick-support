{% macro shot(name, alt, caption=None, cls='shot', eager=False, h_ratio=2) -%}
<figure class="{{ cls }}">
<img src="{{ rel('/assets/img/' ~ name ~ '-360.webp') }}" srcset="{{ rel('/assets/img/' ~ name ~ '-360.webp') }} 360w, {{ rel('/assets/img/' ~ name ~ '-720.webp') }} 720w" sizes="(max-width: 600px) 70vw, 300px" width="360" height="{{ (360 * h_ratio)|round|int }}" alt="{{ alt }}"{% if not eager %} loading="lazy" decoding="async"{% else %} fetchpriority="high"{% endif %}>
{%- if caption %}<figcaption>{{ caption }}</figcaption>{% endif %}
</figure>
{%- endmacro %}
{% macro badges(stores, t) -%}
<!-- STORE-BADGES:START  (store links come from site/config.json "stores"; empty = not public yet) -->
<div class="store-links">
{%- if stores.app_store %}<a class="store-badge" href="{{ stores.app_store }}" rel="noopener"><img src="{{ rel('/assets/app-store-badge-black.svg') }}" width="119.66407" height="40" alt="Download on the App Store"></a>{% endif %}
{%- if stores.google_play %}<a class="store-badge" href="{{ stores.google_play }}" rel="noopener"><img src="{{ rel('/assets/google-play-badge.svg') }}" width="134.87" height="40" alt="Get it on Google Play"></a>
{%- else %}
<!-- Future Google Play URL: https://play.google.com/store/apps/details?id=com.py.fridgepick -->
<div class="store-badge store-badge-soon"><img src="{{ rel('/assets/google-play-badge.svg') }}" width="134.87" height="40" alt="Get it on Google Play"><span class="store-soon-caption">Coming soon</span></div>
{%- endif %}
</div>
<!-- STORE-BADGES:END -->
{%- endmacro %}
